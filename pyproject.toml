[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthy"
version = "0.1.0"
description = "Sheet music (PDF/images) to Synthesia-ready MIDI, powered by Audiveris"
requires-python = ">=3.11"
dependencies = [
    "music21>=9.1",
    "mido>=1.3",
    "pymupdf>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
synthy = "synthy.cli:main"

[tool.setuptools.packages.find]
include = ["synthy*"]

[tool.setuptools.package-data]
"synthy.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
